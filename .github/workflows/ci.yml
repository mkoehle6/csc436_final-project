# Continuous integration (D4, Q1).
#
# Runs on every push and pull request. Render's staging services use
# `autoDeployTrigger: checksPass`, so a commit on main reaches staging only
# after this workflow succeeds; production is promoted from staging separately.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history, to see which files a push changed

      # Blueprint auto-sync is OFF in Render (see README, "Changing render.yaml"):
      # a render.yaml change takes effect only after a Manual Sync, so make it
      # impossible to miss.
      - name: Flag render.yaml changes (Manual Sync needed)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null && git diff --name-only "$BEFORE" "$GITHUB_SHA" -- render.yaml | grep -q .; then
            echo "::warning title=render.yaml changed::Apply it in Render with Blueprint Manual Sync, after the code it needs is on staging AND production (auto-sync is off)."
            echo "### ⚠️ render.yaml changed: run Blueprint **Manual Sync** in Render once the code it needs is on staging and production." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "24" # same major as render.yaml's NODE_VERSION
          cache: npm

      - name: Record build identity
        run: |
          {
            echo "### Build identity"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Ref: \`${GITHUB_REF}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "- Node: $(node --version), npm: $(npm --version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies (from lockfile)
        run: npm ci

      - name: Validate render.yaml against Render's Blueprint schema
        run: npm run validate:render

      - name: Typecheck (strict, frontend + backend)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build (same commands Render runs)
        run: npm run build
